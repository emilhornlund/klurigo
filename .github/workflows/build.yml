# .github/workflows/build.yml
name: Build
on:
  workflow_call:
    inputs:
      run_e2e:
        description: "Run Playwright e2e tests"
        required: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  static-build:
    name: Static Checks & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Check types
        run: yarn check-types

      - name: Lint
        run: yarn lint

      - name: Check Circular Dependencies
        run: yarn workspace @klurigo/klurigo-service check-circular-deps

      - name: Upload Klurigo artifacts for Sentry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: klurigo-sentry-artifacts
          path: packages/klurigo-web/dist/assets/**/*.map

      - name: Upload Klurigo Service artifacts for Sentry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: klurigo-service-sentry-artifacts
          path: packages/klurigo-service/dist/**/*.map

  unit-coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build common package
        run: yarn workspace @klurigo/common build

      - name: Docker compose up
        run: docker compose up -d --wait mongodb redis

      - name: Test & Coverage
        run: yarn test:coverage

      - name: Docker compose down
        if: always()
        run: docker compose down -v

      - name: Upload coverage (common)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./packages/common/coverage/lcov.info
          flags: common
          name: common
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage (klurigo-web)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./packages/klurigo-web/coverage/lcov.info
          flags: klurigo-web
          name: klurigo-web
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage (klurigo-service unit)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./packages/klurigo-service/coverage/unit/lcov.info
          flags: klurigo-service-unit
          name: klurigo-service-unit
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage (klurigo-service e2e)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./packages/klurigo-service/coverage/e2e/lcov.info
          flags: klurigo-service-e2e
          name: klurigo-service-e2e
          disable_search: true
          fail_ci_if_error: true
          verbose: true

  e2e:
    name: Playwright E2E
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build common package
        run: yarn workspace @klurigo/common build

      - name: Docker compose up
        run: docker compose up -d --wait mongodb redis

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION="$(node -e "const fs = require('node:fs'); const path = require('node:path'); const packageRoot = path.dirname(require.resolve('@playwright/test')); const packageJson = JSON.parse(fs.readFileSync(path.join(packageRoot, 'package.json'), 'utf8')); process.stdout.write(packageJson.version)")"
          echo "version=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and system dependencies
        run: yarn workspace @klurigo/klurigo-web playwright install chromium firefox webkit --with-deps

      - name: E2E Tests
        env:
          CI: "true"
        run: yarn workspace @klurigo/klurigo-web test:e2e

      - name: Docker compose down
        if: always()
        run: docker compose down -v
